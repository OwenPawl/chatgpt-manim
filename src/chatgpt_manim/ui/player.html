<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manim animation</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#172235;--muted:#66758c;--line:#e2e8f0;--accent:#146d85;--soft:#f3f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif}main{padding:20px;max-width:1100px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:750}h1{font-size:20px;line-height:1.3;margin:4px 0 0;font-weight:650}.badge{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:5px 10px;white-space:nowrap;font-size:12px;color:var(--muted)}.stage{border-radius:12px;overflow:hidden;background:#101827;aspect-ratio:16/9;display:grid;place-items:center;position:relative}video{width:100%;height:100%;display:block}.empty{color:#c0d2e5;padding:30px;text-align:center}.empty b{display:block;color:#fff;font-size:18px;margin-bottom:8px}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}button,select,a.download{background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer;text-decoration:none}button:hover,a.download:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}label{color:var(--muted);display:flex;align-items:center;gap:6px;font-size:12px}.spacer{flex:1}p{color:var(--muted);margin:12px 0}details{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}summary{cursor:pointer;color:var(--muted);font-size:12px}pre{max-height:220px;overflow:auto;padding:12px;background:var(--soft);border-radius:8px;white-space:pre-wrap;font:12px/1.5 monospace}#error{color:#b42338;white-space:pre-wrap}footer{font-size:11px;color:var(--muted);margin-top:14px} [hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#141a23;--fg:#e3ebf5;--muted:#a1afc2;--line:#303c4e;--accent:#70d6ff;--soft:#202a38}}html[data-theme=dark]{--bg:#141a23;--fg:#e3ebf5;--muted:#a1afc2;--line:#303c4e;--accent:#70d6ff;--soft:#202a38}html[data-theme=light]{--bg:#fff;--fg:#172235;--muted:#66758c;--line:#e2e8f0;--accent:#146d85;--soft:#f3f7fa}@media(max-width:480px){main{padding:12px}h1{font-size:17px}.tools{gap:6px}button,select,a.download{padding:6px 8px}}
</style></head><body><main>
<header><div><div class="eyebrow">Manim · visual explanation</div><h1 id="title">Your animation</h1></div><span class="badge" id="status" role="status" aria-live="polite">Connecting</span></header>
<div class="stage"><div class="empty" id="loading"><b>Bringing the idea to life</b><span id="message">Waiting for the animation tool…</span></div><video id="video" controls playsinline preload="metadata" hidden aria-label="Animation player"></video></div>
<div class="tools"><button id="play" disabled>Play</button><label>Speed <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="fullscreen">Fullscreen</button><span class="spacer"></span><button id="refresh">Refresh</button><a id="download" class="download" hidden download="animation.mp4" rel="noreferrer">Download</a></div>
<p id="description"></p><p id="error" role="alert" hidden></p><details><summary>Scene specification</summary><pre id="source">No scene loaded.</pre></details><footer>Rendered with Manim Community · Ask in chat to change the pacing, colors, or explanation.</footer>
</main><script>
'use strict';
const $=id=>document.getElementById(id), video=$('video');let nextId=0,job=null,poll=null,pollCount=0;const pending=new Map();
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function request(method,params){return new Promise((resolve,reject)=>{const id=++nextId;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('The host did not respond. Try Refresh.'));},15000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function error(message){$('error').textContent=message;$('error').hidden=false;}
function apply(result){if(result?.isError){error(result.content?.map(x=>x.text||'').join('\n')||'The tool could not complete this request.');return;}const data=result?.structuredContent;if(!data?.id)return;const changed=job!==data.id;job=data.id;if(changed)pollCount=0;clearTimeout(poll);$('error').hidden=true;$('title').textContent=data.spec.title;$('description').textContent=data.spec.description||'';$('source').textContent=JSON.stringify(data.spec,null,2);$('status').textContent=data.cached?'Cached · '+data.status:data.status;
if(data.status==='ready'&&result._meta?.media_url){const url=new URL(result._meta.media_url);if(!['http:','https:'].includes(url.protocol))return;const time=changed?0:video.currentTime;video.src=url.href;video.onloadedmetadata=()=>{if(time<video.duration)video.currentTime=time;};video.hidden=false;$('loading').hidden=true;$('play').disabled=false;$('download').href=url.href;$('download').hidden=false;}
else if(data.status==='failed'){video.hidden=true;$('loading').hidden=false;$('message').textContent='This scene could not be rendered.';$('play').disabled=true;$('download').hidden=true;error(data.error||'Rendering failed. Ask in chat to revise the scene.');}
else{video.hidden=true;$('loading').hidden=false;$('message').textContent=data.status==='queued'?'Queued for rendering…':'Rendering frames…';$('play').disabled=true;$('download').hidden=true;if(pollCount++<90)poll=setTimeout(refresh,2000);else error('Rendering is taking longer than expected. Use Refresh to check again.');}}
async function refresh(){if(!job)return;try{apply(await request('tools/call',{name:'get_animation',arguments:{animation_id:job}}));}catch(e){error(e.message);}}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(new Error(m.error.message||'Host error')):p.resolve(m.result);return;}if(m.method==='ui/notifications/tool-result')apply(m.params);if(m.method==='ui/notifications/host-context-changed'&&m.params?.theme)document.documentElement.dataset.theme=m.params.theme;});
$('play').onclick=()=>video.paused?video.play().catch(e=>error(e.message)):video.pause();video.onplay=()=>$('play').textContent='Pause';video.onpause=()=>$('play').textContent='Play';video.onerror=()=>error('The video could not load. Its temporary link may have expired; press Refresh.');$('speed').onchange=()=>video.playbackRate=Number($('speed').value);$('refresh').onclick=refresh;$('fullscreen').onclick=()=>{if(video.requestFullscreen)video.requestFullscreen().catch(()=>error('Fullscreen is unavailable in this host.'));};
(async()=>{try{const host=await request('ui/initialize',{appInfo:{name:'manim-player',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});if(host.hostContext?.theme)document.documentElement.dataset.theme=host.hostContext.theme;notify('ui/notifications/initialized',{});notify('ui/notifications/size-changed',{height:document.body.scrollHeight});}catch(e){$('status').textContent='Host unavailable';error(e.message);}})();
window.addEventListener('pagehide',()=>{clearTimeout(poll);for(const p of pending.values())clearTimeout(p.timer);pending.clear();});
</script></body></html>
