# Linux rootless Podman host. Enable its USER socket first; never mount a root Docker socket.
services:
  server:
    build: .
    user: "1000:1000"
    ports: ["127.0.0.1:8787:8787"]
    env_file: .env
    environment:
      MANIM_RUNTIME: podman-remote
      MANIM_DATA_DIR: /data
    volumes:
      - ./data:/data
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
